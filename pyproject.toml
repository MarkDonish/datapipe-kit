[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datapipe-kit"
version = "1.0.0"
description = "Zero-dependency Python web data extraction, normalization, and interactive HTML reporting toolkit."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Commercial / MIT-Core"}
authors = [{name = "DataPipe Kit"}]

[project.scripts]
datapipe = "datapipe.cli:main"
